name: HareParse 门禁

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: 构建与回归
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 运行仓库门禁
        run: sh ci/run.sh
